/* =========================================================
   Paira — Schedule screen (real dates, this/other weeks)
   ========================================================= */

const Schedule = {
  weekOffset: 0,
  selectedDate: null,

  mount(container){
    this.container = container;
    this.selectedDate = fmtDate(new Date());
    this.weekOffset = 0;
    this.render();
  },
  unmount(){},

  getWeekDates(){
    const today = new Date();
    const dow = today.getDay(); // 0 sun .. 6 sat
    const mondayOffset = (dow === 0 ? -6 : 1 - dow);
    const monday = addDays(today, mondayOffset + this.weekOffset*7);
    return Array.from({length:7}).map((_,i)=>addDays(monday, i));
  },

  render(){
    const weekDates = this.getWeekDates();
    const todayStr = fmtDate(new Date());
    const order = ['mon','tue','wed','thu','fri','sat','sun'];

    const strip = weekDates.map((d,i)=>{
      const ds = fmtDate(d);
      const wd = order[i];
      const isSelected = ds === this.selectedDate;
      const isToday = ds === todayStr;
      const isStudy = Store.data.studyDays.includes(wd);
      return `
        <div class="week-day ${isSelected?'selected':''} ${isToday?'today':''} ${!isStudy?'off':''}" data-date="${ds}">
          <div class="wd-name">${WEEKDAY_LABELS_SHORT[wd]}</div>
          <div class="wd-num">${d.getDate()}</div>
        </div>`;
    }).join('');

    this.container.innerHTML = `
      <div class="topbar">
        <h1>Расписание</h1>
        <div style="display:flex; gap:8px;">
          <button class="icon-btn" id="prevWeek">${Icons.chevronLeft}</button>
          <button class="icon-btn" id="nextWeek">${Icons.chevron}</button>
        </div>
      </div>
      <div class="screen" style="padding-top:2px;">
        <div class="week-strip">${strip}</div>
        <div id="dayContent"></div>
      </div>
    `;
    document.getElementById('prevWeek').onclick = () => { this.weekOffset--; this.render(); };
    document.getElementById('nextWeek').onclick = () => { this.weekOffset++; this.render(); };
    this.container.querySelectorAll('.week-day').forEach(el=>{
      el.onclick = () => { this.selectedDate = el.dataset.date; this.render(); };
    });
    this.renderDay();
  },

  renderDay(){
    const ds = this.selectedDate;
    const dayInfo = getDayType(ds);
    const el = document.getElementById('dayContent');
    let banner = '';
    const bannerMap = {
      vacation: {cls:'vacation', text: 'Каникулы · ' + (dayInfo.vacation ? escapeHTML(dayInfo.vacation.name) : '')},
      holiday: {cls:'holiday', text: 'Праздник'},
      sick: {cls:'sick', text: 'Больничный'},
      personal: {cls:'personal', text: 'Личный выходной'},
      short: {cls:'short', text: 'Сокращённый день'},
      weekend: {cls:'weekend', text: 'Выходной'}
    };
    if(bannerMap[dayInfo.type]){
      let bannerText = bannerMap[dayInfo.type].text;
      if(dayInfo.type==='sick' && dayInfo.sickLeave && dayInfo.sickLeave.reason) bannerText += ' · ' + escapeHTML(dayInfo.sickLeave.reason);
      banner = `<div class="day-banner ${bannerMap[dayInfo.type].cls}">${bannerText}</div>`;
    }

    const lessons = getLessonsForDate(ds, dayInfo);

    let list = '';
    if(lessons.length === 0){
      list = `<div class="empty-state"><div class="emoji">🗓️</div><div class="title">Пар не запланировано</div><div class="desc">На этот день ничего не добавлено</div></div>`;
    } else {
      list = lessons.map(l=>{
        const subj = Store.getSubject(l.subjectId);
        const hasHw = subj ? Store.activeHomeworkForSubject(subj.id).length>0 : false;
        const att = Store.getAttendance(ds, l.n);
        return `
          <div class="lesson-row ${l.cancelled?'cancelled':''}" data-open-lesson="${l.n}">
            <div class="lesson-num">${l.n}</div>
            <div class="lesson-time">${l.start}<br>${l.end}</div>
            <div class="lesson-info">
              <div class="lesson-subject ${l.cancelled?'lesson-strike':''}">${subjectDot(subj?subj.color:'#ccc')}${escapeHTML(subj?subj.name:'—')}</div>
              <div class="lesson-sub">${l.cancelled ? 'Отменена' : [subj&&subj.room?('Каб. '+subj.room):'', subj&&subj.teacher].filter(Boolean).join(' · ')}</div>
            </div>
            <div class="lesson-right">
              ${att && !l.cancelled ? `<span style="font-size:11px; font-weight:800; padding:3px 7px; border-radius:8px; background:${att.status==='absent'?(att.worked?'var(--success-soft)':'var(--danger-soft)'):'var(--success-soft)'}; color:${att.status==='absent'?(att.worked?'var(--success)':'var(--danger)'):'var(--success)'};">${att.status==='absent'?(att.worked?'Н✓':'Н'):(att.status==='excused'?'УП':'Был')}</span>` : ''}
              ${hasHw && !l.cancelled ? `<div class="hw-flag">${Icons.doc}</div>` : ''}
              ${Icons.chevron}
            </div>
          </div>
        `;
      }).join('');
    }

    const canEdit = ['regular','short'].includes(dayInfo.type) || lessons.length>0;

    el.innerHTML = `
      ${banner}
      ${list}
      ${canEdit ? `<div class="fab-row"><button class="fab" id="addLessonBtn">${Icons.plus} Добавить пару</button></div>` : ''}
    `;

    el.querySelectorAll('[data-open-lesson]').forEach(row=>{
      row.onclick = () => this.openLessonSheet(ds, Number(row.dataset.openLesson), dayInfo);
    });
    const addBtn = document.getElementById('addLessonBtn');
    if(addBtn) addBtn.onclick = () => this.openAddLessonSheet(ds, dayInfo);
  },

  openAddLessonSheet(ds, dayInfo){
    const templateKind = dayInfo.type === 'short' ? 'short' : 'regular';
    const template = Store.data.timeTemplates[templateKind];
    const existing = getLessonsForDate(ds, dayInfo).map(l=>l.n);
    const free = template.filter(t => !existing.includes(t.n));
    if(free.length === 0){ toast('Все пары уже добавлены'); return; }
    openModal(`
      <div class="modal-title">Добавить пару<button class="close-x" id="closeX">${Icons.close}</button></div>
      <div id="slotChoice">
        ${free.map(t=>`<div class="subject-picker-item" data-n="${t.n}" style="cursor:pointer;"><div class="lesson-num" style="width:30px;height:30px;font-size:12px;">${t.n}</div><div style="flex:1;"><div class="sname">Пара ${t.n}</div><div class="smeta">${t.start} – ${t.end}</div></div>${Icons.chevron}</div>`).join('')}
      </div>
    `, (ov)=>{
      ov.querySelector('#closeX').onclick = closeModal;
      ov.querySelectorAll('[data-n]').forEach(row=>{
        row.onclick = () => {
          const n = Number(row.dataset.n);
          closeModal();
          openSubjectPickerModal((subjectId)=>{
            Store.setOverride(ds, n, { type:'replace', subjectId });
            this.renderDay();
            toast('Пара добавлена');
          });
        };
      });
    });
  },

  openLessonSheet(ds, n, dayInfo){
    const lessons = getLessonsForDate(ds, dayInfo);
    const l = lessons.find(x=>x.n===n);
    if(!l) return;
    const subj = Store.getSubject(l.subjectId);
    const hw = subj ? Store.activeHomeworkForSubject(subj.id) : [];
    const dayLabel = formatDayLabel(ds);

    openModal(`
      <div class="modal-title">Пара ${n}<button class="close-x" id="closeX">${Icons.close}</button></div>
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:6px;">
        <div class="hw-swatch" style="background:${subj?subj.color:'#ccc'}">${subjectShort(subj?subj.name:'?')}</div>
        <div>
          <div style="font-weight:800; font-size:16px; ${l.cancelled?'text-decoration:line-through;color:var(--text-tertiary);':''}">${escapeHTML(subj?subj.name:'—')}</div>
          <div style="font-size:12.5px; color:var(--text-secondary);">${l.start} – ${l.end}, ${dayLabel}${subj&&subj.room?(' · Каб. '+escapeHTML(subj.room)):''}</div>
        </div>
      </div>
      ${l.cancelled ? `<div class="day-banner sick" style="margin-top:14px;">Пара отменена на этот день</div>` : ''}
      ${(!l.cancelled && hw.length) ? `<div class="section-title" style="margin-top:14px;">Домашнее задание</div>${hw.map(h=>`<div class="hw-text" style="margin-bottom:6px;">${escapeHTML(h.text)}</div>`).join('')}` : ''}
      <div style="margin-top:20px; display:flex; flex-direction:column; gap:10px;">
        ${!l.cancelled ? `<button class="btn-secondary" id="attBtn" style="margin-top:0;">${Icons.users} Посещение${(()=>{ const a=Store.getAttendance(ds,l.n); return a?': '+attLabel(a.status):''; })()}</button>` : ''}
        ${!l.cancelled ? `<button class="btn-secondary" id="rescheduleBtn" style="margin-top:0;">${Icons.swap} Заменить предмет на этот день</button>` : ''}
        ${!l.cancelled ? `<button class="btn-secondary" id="cancelBtn" style="margin-top:0;">${Icons.ban} Отменить пару</button>` : `<button class="btn-secondary" id="restoreBtn" style="margin-top:0;">Вернуть пару</button>`}
      </div>
    `, (ov)=>{
      ov.querySelector('#closeX').onclick = closeModal;
      const attBtn = ov.querySelector('#attBtn');
      if(attBtn) attBtn.onclick = () => {
        openAttendanceModal(ds, l, () => { closeAllModals(); this.renderDay(); });
      };
      const resBtn = ov.querySelector('#rescheduleBtn');
      if(resBtn) resBtn.onclick = () => {
        closeModal();
        openSubjectPickerModal((subjectId)=>{
          Store.setOverride(ds, n, { type:'replace', subjectId });
          this.renderDay();
          toast('Пара изменена на этот день');
        });
      };
      const cBtn = ov.querySelector('#cancelBtn');
      if(cBtn) cBtn.onclick = () => {
        Store.setOverride(ds, n, { type:'cancel' });
        closeModal();
        this.renderDay();
        toast('Пара отменена');
      };
      const rBtn = ov.querySelector('#restoreBtn');
      if(rBtn) rBtn.onclick = () => {
        Store.setOverride(ds, n, null);
        closeModal();
        this.renderDay();
        toast('Пара восстановлена');
      };
    });
  }
};


/* ===== screen-homework.js ===== */
/* =========================================================
   Paira — Homework screen
   ========================================================= */

const Homework = {
  mode: 'list', // 'list' | 'bysubject'
  filter: 'all', // 'all' | 'active' | 'done'
  subjectFilter: null,

  mount(container, opts){
    this.container = container;
    if(opts && opts.subjectFilter){ this.subjectFilter = opts.subjectFilter; this.mode = 'list'; this.filter = 'active'; }
    this.render();
  },
  unmount(){},

  dueBadge(dueDate){
    if(!dueDate) return { text:'Без срока', urgent:false };
    const today = fmtDate(new Date());
    const tmr = fmtDate(addDays(new Date(),1));
    if(dueDate < today) return { text:'Просрочено · ' + formatDayLabel(dueDate), urgent:true };
    if(dueDate === today) return { text:'Срок сегодня', urgent:true };
    if(dueDate === tmr) return { text:'Срок завтра', urgent:false };
    return { text:'Срок: ' + formatDayLabel(dueDate), urgent:false };
  },

  getFiltered(){
    let list = Store.data.homework.slice();
    if(this.subjectFilter) list = list.filter(h=>h.subjectId===this.subjectFilter);
    if(this.filter === 'active') list = list.filter(h=>!h.done);
    if(this.filter === 'done') list = list.filter(h=>h.done);
    list.sort((a,b)=>{
      if(a.done !== b.done) return a.done ? 1 : -1;
      return (a.dueDate||'9999').localeCompare(b.dueDate||'9999');
    });
    return list;
  },

  render(){
    const subj = this.subjectFilter ? Store.getSubject(this.subjectFilter) : null;
    this.container.innerHTML = `
      <div class="topbar">
        <h1>${subj ? escapeHTML(subj.name) : 'Домашние задания'}</h1>
      </div>
      <div class="screen" style="padding-top:2px;">
        ${subj ? `<button class="chip" id="clearSubjFilter" style="margin-bottom:12px;">✕ Показать все предметы</button>` : ''}
        <div class="seg-tabs">
          <button class="seg-tab ${this.mode==='list'?'active':''}" data-mode="list">Список</button>
          <button class="seg-tab ${this.mode==='bysubject'?'active':''}" data-mode="bysubject">По предметам</button>
        </div>
        ${this.mode==='list' ? `
        <div class="chip-row">
          <button class="chip ${this.filter==='all'?'active':''}" data-filter="all">Все</button>
          <button class="chip ${this.filter==='active'?'active':''}" data-filter="active">Активные</button>
          <button class="chip ${this.filter==='done'?'active':''}" data-filter="done">Выполненные</button>
        </div>` : ''}
        <div id="hwList"></div>
        <div class="fab-row"><button class="fab" id="addHwBtn">${Icons.plus} Добавить ДЗ</button></div>
      </div>
    `;
    if(subj) document.getElementById('clearSubjFilter').onclick = () => { this.subjectFilter=null; this.filter='all'; this.render(); };
    this.container.querySelectorAll('[data-mode]').forEach(b=>{
      b.onclick = () => { this.mode = b.dataset.mode; this.render(); };
    });
    this.container.querySelectorAll('[data-filter]').forEach(b=>{
      b.onclick = () => { this.filter = b.dataset.filter; this.render(); };
    });
    document.getElementById('addHwBtn').onclick = () => this.openAddForm();
    this.renderList();
  },

  renderList(){
    const el = document.getElementById('hwList');
    if(this.mode === 'list'){
      const list = this.getFiltered();
      if(list.length===0){
        el.innerHTML = this.emptyState();
        return;
      }
      el.innerHTML = list.map(h=>this.card(h)).join('');
    } else {
      const subs = Store.data.subjects;
      if(subs.length===0){ el.innerHTML = this.emptyState(); return; }
      el.innerHTML = subs.map(s=>{
        const items = Store.data.homework.filter(h=>h.subjectId===s.id).sort((a,b)=>(a.done-b.done) || (a.dueDate||'').localeCompare(b.dueDate||''));
        if(items.length===0) return '';
        return `<div class="section-title">${escapeHTML(s.name)}</div>${items.map(h=>this.card(h)).join('')}`;
      }).join('') || this.emptyState();
    }
    this.bindCardEvents();
  },

  emptyState(){
    if(this.filter==='done') return `<div class="empty-state"><div class="emoji">✅</div><div class="title">Выполненных нет</div><div class="desc">Пока ничего не отмечено</div></div>`;
    if(this.filter==='active' && Store.data.homework.length>0) return `<div class="empty-state"><div class="emoji">🎉</div><div class="title">Всё готово</div><div class="desc">Активных заданий нет</div></div>`;
    return `<div class="empty-state"><div class="emoji">📄</div><div class="title">Домашних заданий нет</div><div class="desc">Нажми «Добавить ДЗ», чтобы создать первое</div></div>`;
  },

  card(h){
    const subj = Store.getSubject(h.subjectId);
    const badge = this.dueBadge(h.dueDate);
    return `
      <div class="hw-card" data-hw-id="${h.id}">
        <div class="hw-swatch" style="background:${subj?subj.color:'#ccc'}">${subjectShort(subj?subj.name:'?')}</div>
        <div class="hw-body">
          <div class="hw-top">
            <div>
              <div class="hw-subject">${escapeHTML(subj?subj.name:'—')}</div>
            </div>
          </div>
          <div class="hw-text ${h.done?'done':''}">${escapeHTML(h.text)}</div>
          <div class="hw-due-row">
            <span class="hw-due ${badge.urgent && !h.done ?'urgent':''}">${badge.text}</span>
            ${h.priority==='important' ? `<span class="hw-prio">Важно</span>` : ''}
          </div>
        </div>

        <div class="subject-picker-item" id="subjPickRow" style="border:1px solid var(--border); border-radius:14px; padding:12px 14px; cursor:pointer;">

          <span class="pill-opt" data-due="tomorrow">Завтра</span>
          <span class="pill-opt" data-due="custom">Выбрать дату</span>

        <div class="pill-select" id="prioPick">

          <span class="pill-opt" data-prio="important">Важно</span>
        </div>
      </div>

    `, (ov)=>{
      ov.querySelector('#closeX').onclick = closeModal;
      ov.querySelector('#subjPickRow').onclick = () => {
        openSubjectPickerModal((subjectId)=>{
          chosenSubject = subjectId;
          const s = Store.getSubject(subjectId);
          ov.querySelector('#subjPickLabel').textContent = s.name;
          ov.querySelector('#subjPickRow .sw').style.background = s.color;
        });
      };
      ov.querySelectorAll('#duePick .pill-opt').forEach(p=>{
        p.onclick = () => {
          ov.querySelectorAll('#duePick .pill-opt').forEach(x=>x.classList.remove('active'));
          p.classList.add('active');
          dueChoice = p.dataset.due;
          ov.querySelector('#customDateInput').style.display = dueChoice==='custom' ? 'block' : 'none';
        };
      });
      ov.querySelector('#customDateInput').onchange = (e) => { customDate = e.target.value; };
      ov.querySelectorAll('#prioPick .pill-opt').forEach(p=>{
        p.onclick = () => {
          ov.querySelectorAll('#prioPick .pill-opt').forEach(x=>x.classList.remove('active'));
          p.classList.add('active');
          priority = p.dataset.prio;
        };
      });
      ov.querySelector('#saveHwBtn').onclick = () => {
        const text = ov.querySelector('#hwText').value.trim();
        if(!text){ toast('Напиши, что задали'); return; }
        let dueDate;
        if(dueChoice==='today') dueDate = fmtDate(new Date());
        else if(dueChoice==='tomorrow') dueDate = fmtDate(addDays(new Date(),1));
        else dueDate = customDate;
        Store.addHomework({ subjectId: chosenSubject, text, dueDate, priority });
        closeModal();
        this.renderList();
        toast('Задание добавлено');
      };
    });
  }
};


/* ===== screen-grades.js ===== */
/* =========================================================
   Paira — Grades screen
   Track marks per subject and see how things are trending
   week over week / month over month.
   ========================================================= */

const Grades = {
  period: 'week', // 'week' | 'month'

  mount(container){
    this.container = container;
    this.render();
  },
  unmount(){},

  render(){
    if(Store.data.subjects.length===0 && Store.data.grades.length===0){
      this.container.innerHTML = `
        <div class="topbar"><h1>Оценки</h1></div>
        <div class="screen" style="padding-top:2px;">
          <div class="empty-state"><div class="emoji">🏆</div><div class="title">Пока нет оценок</div><div class="desc">Сначала добавь хотя бы один предмет в профиле</div></div>
        </div>
      `;
      return;
    }

    const all = Store.data.grades;
    const overallAvg = overallAverageWithPenalties();
    const unworked = Store.unworkedAbsences();

    const buckets = gradeBuckets(this.period, this.period==='week' ? 8 : 6);
    const lastTwo = buckets.slice(-2);
    const trend = trendArrow(lastTwo[1] ? lastTwo[1].average : null, lastTwo[0] ? lastTwo[0].average : null);
    const currentBucket = buckets[buckets.length-1];

    const bySubj = Store.data.subjects.map(s => ({ s, stat: subjectGradeStats(s.id) })).filter(x=>x.stat.count>0)
      .sort((a,b)=> (b.stat.average||0) - (a.stat.average||0));

    const recent = all.slice().sort((a,b)=> b.date.localeCompare(a.date) || 0).slice(0,12);

    this.container.innerHTML = `
      <div class="topbar">
        <h1>Оценки</h1>
        <button class="icon-btn" id="addGradeBtn">${Icons.plus}</button>
      </div>
      <div class="screen" style="padding-top:2px;">
        <div class="stat-grid">
          <div class="stat-card">
            <div class="k">Средний балл</div>
            <div class="v">${overallAvg!=null ? Math.round(overallAvg) : '—'}</div>
            ${overallAvg!=null ? `<div class="mark-chip" style="color:${markColor(overallAvg)}">оценка ${markFromScore(overallAvg)}</div>` : ''}
          </div>
          <div class="stat-card">
            <div class="k">${this.period==='week'?'Эта неделя':'Этот месяц'}</div>
            <div class="v">${currentBucket.average!=null ? Math.round(currentBucket.average) : '—'}</div>
            ${trend ? `<div class="trend ${trend.dir}">${trend.dir==='up'?'↑':trend.dir==='down'?'↓':'→'} ${trend.dir==='flat'?'без изменений':Math.round(Math.abs(trend.diff))}</div>` : ''}
          </div>
        </div>

        <div class="section-title">
          Динамика
          <span class="link" id="periodToggle">${this.period==='week'?'По месяцам':'По неделям'}</span>
        </div>
        <div class="grade-chart-wrap">${this.renderChart(buckets)}</div>

        ${bySubj.length ? `
        <div class="section-title">По предметам</div>
        ${bySubj.map(({s,stat})=>{
          const pct = Math.max(4, Math.min(100, stat.average));
          return `<div class="subj-avg-row">
            <div class="sw" style="background:${s.color}"></div>
            <div style="flex:1; min-width:0;">
              <div style="display:flex; justify-content:space-between; font-size:13.5px; font-weight:700; margin-bottom:6px;">
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHTML(s.name)}</span>
                <span style="color:var(--text-secondary); font-weight:700;">${Math.round(stat.average)} <span style="color:${markColor(stat.average)};">· ${markFromScore(stat.average)}</span></span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${s.color};"></div></div>
            </div>
          </div>`;
        }).join('')}
        ` : ''}

        ${unworked.length ? `
        <div class="section-title">Нужно отработать <span class="link" style="color:var(--danger);">${unworked.length}</span></div>
        ${unworked.map(a=>{
          const s = Store.getSubject(a.subjectId);
          return `<div class="grade-row">
            <div class="grade-badge" style="background:var(--danger)">Н</div>
            <div class="gr-body">
              <div class="gr-subj">${escapeHTML(s?s.name:'—')}</div>
              <div class="gr-meta">${formatDayLabel(a.date)} · пара ${a.n} · как 49 баллов, пока не отработано</div>
            </div>
            <button class="btn-secondary" data-mark-worked="${a.date}_${a.n}" style="margin:0; padding:8px 12px; font-size:12.5px; white-space:nowrap;">Отработано</button>
          </div>`;
        }).join('')}
        ` : ''}

        <div class="section-title">
          Последние оценки
        </div>
        ${recent.length===0 ? `<p style="color:var(--text-tertiary); font-size:13.5px;">Пока нет оценок</p>` :
          recent.map(g=>{
            const s = Store.getSubject(g.subjectId);
            return `<div class="grade-row" data-grade-id="${g.id}">
              <div class="grade-badge" style="background:${s?s.color:'#999'}">${g.value}</div>
              <div class="gr-body">
                <div class="gr-subj">${escapeHTML(s?s.name:'—')}<span class="gr-mark" style="color:${markColor(g.value)};">· ${markFromScore(g.value)}</span></div>
                <div class="gr-meta">${formatDayLabel(g.date)}${g.comment?' · '+escapeHTML(g.comment):''}</div>
              </div>
              ${Icons.chevron}
            </div>`;
          }).join('')}
      </div>
    `;

    this.container.querySelector('#addGradeBtn').onclick = () => this.openAddGrade();
    const pt = this.container.querySelector('#periodToggle');
    if(pt) pt.onclick = () => { this.period = this.period==='week' ? 'month' : 'week'; this.render(); };
    this.container.querySelectorAll('[data-grade-id]').forEach(row=>{
      row.onclick = () => this.openGradeDetail(row.dataset.gradeId);
    });
    this.container.querySelectorAll('[data-mark-worked]').forEach(btn=>{
      btn.onclick = (e) => {
        e.stopPropagation();
        Store.toggleWorked(btn.dataset.markWorked);
        this.render();
        toast('Отмечено как отработано');
      };
    });
  },

  renderChart(buckets){
    const w = 320, h = 140, padL = 28, padB = 22, padT = 12;
    const plotW = w - padL - 10, plotH = h - padB - padT;
    const scaleY = (v) => padT + plotH - (v/100)*plotH;
    const stepX = plotW / Math.max(1, buckets.length-1);
    const withVal = buckets.filter(b=>b.average!=null);
    let pathD = '';
    withVal.forEach((b,i)=>{
      const idx = buckets.indexOf(b);
      const x = padL + idx*stepX;
      const y = scaleY(b.average);
      pathD += (pathD ? ' L ' : 'M ') + x.toFixed(1) + ' ' + y.toFixed(1);
    });
    // gridlines at the mark boundaries (50/70/90) plus 0 and 100
    const gridLines = [0,50,70,90,100].map(v=>{
      const y = scaleY(v);
      return `<line x1="${padL}" y1="${y}" x2="${w-8}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="2" y="${y+4}" font-size="9.5" fill="var(--text-tertiary)">${v}</text>`;
    }).join('');
    const dots = withVal.map(b=>{
      const idx = buckets.indexOf(b);
      const x = padL + idx*stepX;
      const y = scaleY(b.average);
      return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--accent)"/>`;
    }).join('');
    const labels = buckets.map((b,i)=>{
      const x = padL + i*stepX;
      return `<text x="${x}" y="${h-4}" font-size="10" fill="var(--text-tertiary)" text-anchor="middle">${b.label}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}">
      ${gridLines}
      ${pathD ? `<path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
      ${dots}
      ${labels}
    </svg>`;
  },

  openAddGrade(){
    let subjectId = Store.data.recentSubjects.find(id=>Store.getSubject(id)) || (Store.data.subjects[0] && Store.data.subjects[0].id) || null;
    let value = 90;
    let date = fmtDate(new Date());
    const presets = [100, 85, 60, 35]; // one representative value per mark tier (5,4,3,2)
    if(!subjectId){ toast('Сначала добавь предмет'); return; }

    const bodyHTML = () => {
      const s = Store.getSubject(subjectId);
      return `
        <div class="modal-title">Новая оценка<button class="close-x" id="closeX">${Icons.close}</button></div>
        <div class="subject-picker-item" id="pickSubjRow" style="cursor:pointer; margin-bottom:14px;">
          <div class="sw" style="background:${s.color}"></div>
          <div style="flex:1;"><div class="sname">${escapeHTML(s.name)}</div></div>
          ${Icons.chevron}
        </div>
        <div class="field">
          <label>Балл (0–100)</label>
          <input type="number" id="gScore" min="0" max="100" value="${value}" style="font-size:26px; font-weight:800; text-align:center;">
          <div id="markPreview" style="text-align:center; margin-top:8px; font-size:13.5px; font-weight:700; color:${markColor(value)};">Оценка: ${markFromScore(value)}</div>
        </div>
        <div class="grade-pills" id="gradePills">
          ${presets.map(v=>`<button class="grade-pill ${v===value?'active':''}" data-v="${v}" style="color:${markColor(v)};">${v}</button>`).join('')}
        </div>
        <div class="field"><label>Дата</label><input type="date" id="gDate" value="${date}"></div>
        <div class="field"><label>Комментарий (необязательно)</label><input type="text" id="gComment" placeholder="Контрольная работа"></div>
        <button class="btn-primary" id="gSaveBtn">Сохранить</button>
      `;
    };

    openModal(bodyHTML(), (ov)=>{
      const bind = () => {
        const updatePreview = () => {
          const mp = ov.querySelector('#markPreview');
          mp.textContent = 'Оценка: ' + markFromScore(value);
          mp.style.color = markColor(value);
          ov.querySelectorAll('#gradePills .grade-pill').forEach(x=>x.classList.toggle('active', Number(x.dataset.v)===value));
        };
        ov.querySelector('#closeX').onclick = closeModal;
        ov.querySelector('#pickSubjRow').onclick = () => {
          openSubjectPickerModal((id)=>{ subjectId = id; updateTopModal(bodyHTML(), bind); });
        };
        ov.querySelectorAll('#gradePills .grade-pill').forEach(p=>{
          p.onclick = () => {
            value = Number(p.dataset.v);
            ov.querySelector('#gScore').value = value;
            updatePreview();
          };
        });
        ov.querySelector('#gScore').oninput = (e) => {
          const n = Number(e.target.value);
          value = isNaN(n) ? 0 : Math.max(0, Math.min(100, n));
          updatePreview();
        };
        ov.querySelector('#gSaveBtn').onclick = () => {
          date = ov.querySelector('#gDate').value || date;
          const comment = ov.querySelector('#gComment').value;
          const raw = Number(ov.querySelector('#gScore').value);
          if(isNaN(raw)){ toast('Введи балл от 0 до 100'); return; }
          value = Math.max(0, Math.min(100, raw));
          Store.addGrade({ subjectId, value, date, comment });
          closeModal();
          this.render();
          toast('Оценка добавлена');
        };
      };
      bind();
    });
  },

  openGradeDetail(id){
    const g = Store.data.grades.find(x=>x.id===id);
    if(!g) return;
    const s = Store.getSubject(g.subjectId);
    openModal(`
      <div class="modal-title">${escapeHTML(s?s.name:'Оценка')}<button class="close-x" id="closeX">${Icons.close}</button></div>
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
        <div class="grade-badge" style="background:${s?s.color:'#999'}; width:48px; height:48px; font-size:20px;">${g.value}</div>
        <div>
          <div style="font-weight:700; font-size:15px;">${formatDayLabel(g.date)} <span style="color:${markColor(g.value)};">· оценка ${markFromScore(g.value)}</span></div>
          ${g.comment ? `<div style="font-size:13px; color:var(--text-secondary);">${escapeHTML(g.comment)}</div>` : ''}
        </div>
      </div>
      <button class="btn-secondary danger" id="delGradeBtn" style="color:var(--danger); border-color:var(--danger-soft);">${Icons.trash} Удалить</button>
    `, (ov)=>{
      ov.querySelector('#closeX').onclick = closeModal;
      ov.querySelector('#delGradeBtn').onclick = () => {
        Store.deleteGrade(id);
        closeModal();
        this.render();
        toast('Оценка удалена');
      };
    });
  }
};

      <div class="modal-title">${existing?'Редактировать предмет':'Новый предмет'}<button class="close-x" id="closeX">${Icons.close}</button></div>
      <div class="field"><label>Название</label><input type="text" id="sName" value="${existing?escapeHTML(existing.name):''}" placeholder="Например, Математика"></div>
      <div class="field"><label>Преподаватель (необязательно)</label><input type="text" id="sTeacher" value="${existing?escapeHTML(existing.teacher):''}" placeholder="Иванов И.И."></div>
      <div class="field"><label>Кабинет (необязательно)</label><input type="text" id="sRoom" value="${existing?escapeHTML(existing.room):''}" placeholder="312"></div>
      <div class="field">
        <label>Цвет</label>
        <div class="color-select" id="colorPick">
          ${SUBJECT_COLORS.map(c=>`<span class="color-dot ${c===color?'active':''}" style="background:${c}" data-color="${c}"></span>`).join('')}
        </div>
      </div>
      <button class="btn-primary" id="saveBtn">Сохранить</button>
      ${existing ? `<button class="btn-secondary" id="delBtn" style="color:var(--danger);">${Icons.trash} Удалить предмет</button>` : ''}
    `, (ov)=>{
      ov.querySelector('#closeX').onclick = closeModal;
      ov.querySelectorAll('#colorPick .color-dot').forEach(d=>{
        d.onclick = () => { ov.querySelectorAll('#colorPick .color-dot').forEach(x=>x.classList.remove('active')); d.classList.add('active'); color = d.dataset.color; };
      });
      ov.querySelector('#saveBtn').onclick = () => {
        const name = ov.querySelector('#sName').value.trim();
        if(!name){ toast('Введи название предмета'); return; }
        const payload = { name, teacher: ov.querySelector('#sTeacher').value.trim(), room: ov.querySelector('#sRoom').value.trim(), color };
        if(existing) Store.updateSubject(existing.id, payload);
        else Store.addSubject(payload);
        closeAllModals();
        this.openSubjects();
        this.render();
      };
      const delBtn = ov.querySelector('#delBtn');
      if(delBtn) delBtn.onclick = () => {
        confirmDialog('Удалить предмет?', 'Он будет убран из расписания и связанных заданий.', 'Удалить', ()=>{
          Store.deleteSubject(existing.id);
          closeAllModals();
          this.openSubjects();
          this.render();
        }, true);
      };
    });
  },

  // ---------------- time templates ----------------
  openTimeTemplates(){
    let kind = 'regular';
    const render = () => {
      const slots = Store.data.timeTemplates[kind];
      updateTopModal(`
        <div class="modal-title">Время пар<button class="close-x" id="closeX">${Icons.close}</button></div>
        <div class="seg-tabs" style="margin-bottom:16px;">
          <button class="seg-tab ${kind==='regular'?'active':''}" data-k="regular">Обычный день</button>
          <button class="seg-tab ${kind==='short'?'active':''}" data-k="short">Сокращённый</button>
        </div>
        <div id="slotsWrap">${slots.map(s=>Onb.slotRow(s)).join('')}</div>
        <button class="btn-secondary" id="addSlotBtn">${Icons.plus} Добавить пару</button>
      `, (ov)=>{
        ov.querySelector('#closeX').onclick = closeModal;
        ov.querySelectorAll('[data-k]').forEach(b=>{ b.onclick = () => { kind = b.dataset.k; render(); }; });
        const bind = () => {
          ov.querySelectorAll('#slotsWrap input[type="time"]').forEach(inp=>{
            inp.onchange = () => {
              const n = Number(inp.dataset.n);
              const row = inp.closest('.slot-row');
              const start = row.querySelector('[data-field="start"]').value;
              const end = row.querySelector('[data-field="end"]').value;
              if(end <= start){ toast('Окончание должно быть позже начала'); return; }
              Store.setTemplateSlot(kind, n, start, end);
              toast('Время обновлено');
            };
          });
          ov.querySelectorAll('#slotsWrap .slot-remove').forEach(btn=>{
            btn.onclick = () => { Store.removeTemplateSlot(kind, Number(btn.dataset.remove)); refresh(); };
          });
        };
        const refresh = () => {
          ov.querySelector('#slotsWrap').innerHTML = Store.data.timeTemplates[kind].map(s=>Onb.slotRow(s)).join('');
          bind();
        };
        bind();
        ov.querySelector('#addSlotBtn').onclick = () => { Store.addTemplateSlot(kind); refresh(); };
      });
    };
    render();
  },

  // ---------------- weekly recurring editor ----------------
  openWeekEditor(){
    const order = ['mon','tue','wed','thu','fri','sat','sun'];
    let dayIdx = 0;
    const render = () => {
      const wd = order[dayIdx];
      const template = Store.data.timeTemplates.regular;
      const current = Store.getLessonsForWeekday(wd);
      updateTopModal(`
        <div class="modal-title">Расписание<button class="close-x" id="closeX">${Icons.close}</button></div>
        <div class="week-strip" style="margin-bottom:14px;">
          ${order.map((d,i)=>`<div class="week-day ${i===dayIdx?'selected':''}" data-di="${i}"><div class="wd-name">${WEEKDAY_LABELS_SHORT[d]}</div></div>`).join('')}
        </div>
        <div id="weekDaySlots">
          ${template.length===0 ? `<p style="color:var(--text-tertiary); font-size:13.5px;">Сначала настрой время пар</p>` : template.map(t=>{
            const ex = current.find(c=>c.n===t.n);
            const subj = ex ? Store.getSubject(ex.subjectId) : null;
            return `
            <div class="day-slot" data-n="${t.n}">
              <div class="dnum">${t.n}</div>
              <div style="flex:1;" data-pick="${t.n}">
                <div class="dselect ${subj?'filled':''}">${subj?escapeHTML(subj.name):'Выбрать предмет'}</div>
                <div class="dtime">${t.start} – ${t.end}</div>
              </div>
              ${subj?`<button class="dremove" data-clear="${t.n}">${Icons.close}</button>`:''}
            </div>`;
          }).join('')}
        </div>
        ${template.length ? `<button class="btn-secondary" id="copyDayBtn" style="margin-top:14px;">${Icons.copy} Скопировать с другого дня</button>` : ''}
      `, (ov)=>{
        ov.querySelector('#closeX').onclick = ()=>{ closeModal(); this.render(); };
        ov.querySelectorAll('[data-di]').forEach(el=>{ el.onclick = () => { dayIdx = Number(el.dataset.di); render(); }; });
        ov.querySelectorAll('[data-pick]').forEach(el=>{
          el.onclick = () => {
            const n = Number(el.dataset.pick);
            openSubjectPickerModal((subjectId)=>{ Store.setLessonSubject(wd, n, subjectId); render(); });
          };
        });
        ov.querySelectorAll('[data-clear]').forEach(el=>{
          el.onclick = (e) => { e.stopPropagation(); Store.setLessonSubject(wd, Number(el.dataset.clear), null); render(); };
        });
        const copyBtn = ov.querySelector('#copyDayBtn');
        if(copyBtn) copyBtn.onclick = () => {
          openModal(`
            <div class="modal-title">Скопировать с какого дня?<button class="close-x" id="closeX2">${Icons.close}</button></div>
            ${order.filter(d=>d!==wd).map(d=>{
              const cnt = Store.getLessonsForWeekday(d).length;
              return `<div class="subject-picker-item" data-src="${d}" style="cursor:pointer;"><div style="flex:1;"><div class="sname">${WEEKDAY_LABELS_FULL[d]}</div><div class="smeta">${cnt} ${pluralRu(cnt,'пара','пары','пар')}</div></div>${Icons.chevron}</div>`;
            }).join('')}
          `, (ov2)=>{
            ov2.querySelector('#closeX2').onclick = closeModal;
            ov2.querySelectorAll('[data-src]').forEach(el=>{
              el.onclick = () => {
                const src = el.dataset.src;
                Store.getLessonsForWeekday(src).forEach(l => Store.setLessonSubject(wd, l.n, l.subjectId));
                closeModal();
                render();
                toast('Расписание скопировано');
              };
            });
          });
        };
      });
    };
    render();
  },

  // ---------------- notifications ----------------
  openNotifications(){
    const n = Store.data.settings.notifications;
    const rowsDef = [
      ['enabled','Включить уведомления'],
      ['beforeLesson','За 10 минут до пары'],
      ['lessonStart','О начале пары'],
      ['lessonEnd','О завершении пары'],
      ['homeworkDue','О сроке сдачи ДЗ']
    ];
    const render = () => {
      openModal(`
        <div class="modal-title">Уведомления<button class="close-x" id="closeX">${Icons.close}</button></div>
        <div class="list-group" style="box-shadow:none;">
          ${rowsDef.map(([key,label])=>`
            <div class="check-row" data-key="${key}" style="padding:14px 15px; cursor:pointer;">
              <span class="crlabel">${label}</span>
              <span class="switch ${n[key]?'on':''}"><span class="knob"></span></span>
            </div>`).join('')}
        </div>
        <p style="color:var(--text-tertiary); font-size:12.5px; line-height:1.5;">Уведомления сохраняются как предпочтение и будут использованы, когда приложение установлено как мобильное.</p>
      `, (ov)=>{
        ov.querySelector('#closeX').onclick = ()=>{ closeModal(); this.render(); };
        ov.querySelectorAll('[data-key]').forEach(row=>{
          row.onclick = () => {
            const key = row.dataset.key;
            n[key] = !n[key];
            if(key==='enabled' && !n.enabled){ ['beforeLesson','lessonStart','lessonEnd','homeworkDue'].forEach(k=>{}); }
            Store.save();
            row.querySelector('.switch').classList.toggle('on', n[key]);
          };
        });
      });
    };
    render();
  },

  // ---------------- settings ----------------
  openSettings(){
    const p = Store.data.profile;
    openModal(`
      <div class="modal-title">Настройки профиля<button class="close-x" id="closeX">${Icons.close}</button></div>
      <div class="field"><label>Имя</label><input type="text" id="fName" value="${escapeHTML(p.name)}"></div>
      <div class="field"><label>Группа</label><input type="text" id="fGroup" value="${escapeHTML(p.group)}"></div>
      <div class="field"><label>Колледж</label><input type="text" id="fCollege" value="${escapeHTML(p.college)}"></div>
      <div class="field">
        <label>Учебные дни</label>
        <div class="pill-select" id="daysPick">
          ${['mon','tue','wed','thu','fri','sat','sun'].map(d=>`<span class="pill-opt ${Store.data.studyDays.includes(d)?'active':''}" data-day="${d}">${WEEKDAY_LABELS_SHORT[d]}</span>`).join('')}
        </div>
      </div>
      <button class="btn-primary" id="saveBtn">Сохранить</button>
      <button class="btn-secondary" id="exportBtn">${Icons.doc} Экспорт данных (JSON)</button>
      <button class="btn-secondary" id="importBtn">${Icons.copy} Импортировать данные</button>
      <input type="file" id="importFile" accept="application/json" class="hidden">
      <button class="btn-secondary" id="resetBtn" style="color:var(--danger);">${Icons.trash} Сбросить все данные</button>
    `, (ov)=>{
      ov.querySelector('#closeX').onclick = closeModal;
      ov.querySelectorAll('#daysPick .pill-opt').forEach(el=>{
        el.onclick = () => {
          const d = el.dataset.day;
          const set = new Set(Store.data.studyDays);
          if(set.has(d)) set.delete(d); else set.add(d);
          Store.data.studyDays = Array.from(set);
          Store.save();
          el.classList.toggle('active');
        };
      });
      ov.querySelector('#saveBtn').onclick = () => {
        p.name = ov.querySelector('#fName').value.trim();
        p.group = ov.querySelector('#fGroup').value.trim();
        p.college = ov.querySelector('#fCollege').value.trim();
        Store.save();
        closeModal();
        this.render();
        toast('Сохранено');
      };
      ov.querySelector('#exportBtn').onclick = () => {
        try{
          const blob = new Blob([JSON.stringify(Store.data, null, 2)], { type:'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'paira-backup.json';
          document.body.appendChild(a); a.click(); a.remove();
          URL.revokeObjectURL(url);
          toast('Файл сохранён');
        } catch(e){ toast('Не удалось выгрузить данные'); }
      };
      ov.querySelector('#importBtn').onclick = () => ov.querySelector('#importFile').click();
      ov.querySelector('#importFile').onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          let parsed;
          try{ parsed = JSON.parse(reader.result); }
          catch(err){ toast('Не удалось прочитать файл'); return; }
          confirmDialog('Импортировать данные?', 'Текущие данные будут заменены содержимым файла paira-backup.json.', 'Импортировать', ()=>{
            localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
            closeModal();
            location.reload();
          }, true);
        };
        reader.readAsText(file);
      };
      ov.querySelector('#resetBtn').onclick = () => {
        confirmDialog('Сбросить все данные?', 'Это удалит расписание, предметы и задания без возможности восстановления.', 'Сбросить', ()=>{
          Store.reset();
          closeModal();
          location.reload();
        }, true);
      };
    });
  }
};

/* =========================================================
   Shared calendar modal — used from Home topbar and Profile
   ========================================================= */
const CalState = { year: new Date().getFullYear(), month: new Date().getMonth() };

const SPECIAL_TYPES = [
  { key:'regular', label:'Обычный день' },
  { key:'personal', label:'Личный выходной' },
  { key:'sick', label:'Больничный' },
  { key:'holiday', label:'Праздник' },
  { key:'short', label:'Сокращённый день' }
];

function openCalendarModal(){
  CalState.year = new Date().getFullYear();
  CalState.month = new Date().getMonth();
  renderCalendarModal();
}

function renderCalendarModal(){
  const y = CalState.year, m = CalState.month;
  const first = new Date(y, m, 1);
  const startDow = (first.getDay()+6)%7; // Monday-first
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayStr = fmtDate(new Date());
  const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell muted"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${y}-${pad2(m+1)}-${pad2(d)}`;
    const info = getDayType(ds);
    let markCls = '';
    if(info.type==='vacation') markCls = 'mark-vacation';
    else if(info.type==='holiday') markCls = 'mark-holiday';
    else if(info.type==='sick') markCls = 'mark-sick';
    else if(info.type==='personal') markCls = 'mark-personal';
    else if(info.type==='short') markCls = 'mark-short';
    cells += `<div class="cal-cell ${markCls} ${ds===todayStr?'today':''}" data-date="${ds}">${d}</div>`;
  }

  updateTopModal(`
    <div class="modal-title">Календарь<button class="close-x" id="closeX">${Icons.close}</button></div>
    <div class="cal-nav">
      <button id="prevM">${Icons.chevronLeft}</button>
      <div class="cn-title">${monthNames[m]} ${y}</div>
      <button id="nextM">${Icons.chevron}</button>
    </div>
    <div class="calendar-grid">
      ${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div style="display:flex; gap:10px; margin-top:18px;">
      <button class="btn-secondary" id="addVacBtn" style="margin-top:0; flex:1;">${Icons.plus} Каникулы</button>
      <button class="btn-secondary" id="addSickBtn" style="margin-top:0; flex:1;">${Icons.plus} Больничный</button>
    </div>
  `, (ov)=>{
    ov.querySelector('#closeX').onclick = closeModal;
    ov.querySelector('#prevM').onclick = () => { CalState.month--; if(CalState.month<0){CalState.month=11;CalState.year--;} renderCalendarModal(); };
    ov.querySelector('#nextM').onclick = () => { CalState.month++; if(CalState.month>11){CalState.month=0;CalState.year++;} renderCalendarModal(); };
    ov.querySelectorAll('[data-date]').forEach(cell=>{
      cell.onclick = () => openDayTypeModal(cell.dataset.date);
    });
    ov.querySelector('#addVacBtn').onclick = () => openVacationForm();
    ov.querySelector('#addSickBtn').onclick = () => openSickForm();
  });
}

function openDayTypeModal(ds){
  const info = getDayType(ds);
  const vac = Store.getVacationForDate(ds);
  const sickLeave = Store.getSickForDate(ds);
  openModal(`
    <div class="modal-title">${formatDayLabel(ds) === 'сегодня' || formatDayLabel(ds)==='завтра' ? formatDayLabel(ds) : ds}<button class="close-x" id="closeX">${Icons.close}</button></div>
    ${vac ? `<p style="font-size:13.5px; color:var(--text-secondary); margin:-6px 0 16px;">Входит в каникулы «${escapeHTML(vac.name)}» (${vac.start} – ${vac.end})</p>
      <button class="btn-secondary" id="removeVacBtn" style="color:var(--danger);">Убрать каникулы</button>` : sickLeave ? `
      <p style="font-size:13.5px; color:var(--text-secondary); margin:-6px 0 16px;">Входит в больничный${sickLeave.reason?' «'+escapeHTML(sickLeave.reason)+'»':''} (${sickLeave.start} – ${sickLeave.end})</p>
      <button class="btn-secondary" id="removeSickBtn" style="color:var(--danger);">Убрать больничный</button>` : `
    <p style="font-size:13px; color:var(--text-secondary); margin:-6px 0 14px;">Тип дня</p>
    <div class="pill-select" id="typePick">
      ${SPECIAL_TYPES.map(t=>`<span class="pill-opt ${ (info.type===t.key || (t.key==='regular' && ['regular','weekend'].includes(info.type))) ?'active':''}" data-type="${t.key}">${t.label}</span>`).join('')}
    </div>
    `}
  `, (ov)=>{
    ov.querySelector('#closeX').onclick = closeModal;
    const rv = ov.querySelector('#removeVacBtn');
    if(rv) rv.onclick = () => { Store.removeVacation(vac.id); closeModal(); renderCalendarModal(); };
    const rs = ov.querySelector('#removeSickBtn');
    if(rs) rs.onclick = () => { Store.removeSickLeave(sickLeave.id); closeModal(); renderCalendarModal(); };
    ov.querySelectorAll('[data-type]').forEach(el=>{
      el.onclick = () => {
        const t = el.dataset.type;
        Store.setSpecialDay(ds, t==='regular' ? null : t);
        closeModal();
        renderCalendarModal();
        toast('День обновлён');
      };
    });
  });
}

function openSickForm(){
  openModal(`
    <div class="modal-title">Больничный<button class="close-x" id="closeX">${Icons.close}</button></div>
    <div class="field"><label>Причина (необязательно)</label><input type="text" id="sickReason" placeholder="ОРВИ"></div>
    <div class="field"><label>Начало</label><input type="date" id="sickStart"></div>
    <div class="field"><label>Конец</label><input type="date" id="sickEnd"></div>
    <button class="btn-primary" id="saveSickBtn">Сохранить</button>
  `, (ov)=>{
    ov.querySelector('#closeX').onclick = closeModal;
    ov.querySelector('#saveSickBtn').onclick = () => {
      const start = ov.querySelector('#sickStart').value;
      const end = ov.querySelector('#sickEnd').value;
      if(!start || !end || end < start){ toast('Проверь даты'); return; }
      Store.addSickLeave(start, end, ov.querySelector('#sickReason').value.trim());
      closeModal();
      renderCalendarModal();
      toast('Больничный добавлен');
    };
  });
}

function openVacationForm(){
  openModal(`
    <div class="modal-title">Каникулы<button class="close-x" id="closeX">${Icons.close}</button></div>
    <div class="field"><label>Название (необязательно)</label><input type="text" id="vacName" placeholder="Зимние каникулы"></div>
    <div class="field"><label>Начало</label><input type="date" id="vacStart"></div>
    <div class="field"><label>Конец</label><input type="date" id="vacEnd"></div>
    <button class="btn-primary" id="saveVacBtn">Сохранить</button>
  `, (ov)=>{
    ov.querySelector('#closeX').onclick = closeModal;
    ov.querySelector('#saveVacBtn').onclick = () => {
      const start = ov.querySelector('#vacStart').value;
      const end = ov.querySelector('#vacEnd').value;
      if(!start || !end || end < start){ toast('Проверь даты'); return; }
      Store.addVacation(start, end, ov.querySelector('#vacName').value.trim() || 'Каникулы');
      closeModal();
      renderCalendarModal();
      toast('Каникулы добавлены');
    };
  });
}

function applyTheme(){
  const t = Store.data.settings.theme;
  let effective = t;
  if(t === 'system') effective = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  if(effective === 'dark') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
}


/* ===== app.js ===== */
/* =========================================================
   Paira — App bootstrap & tab routing
   ========================================================= */

const App = {
  currentTab: null,
  modules: { home: Home, schedule: Schedule, homework: Homework, grades: Grades, profile: Profile },

  init(){
    Store.load();
    applyTheme();
    if(window.matchMedia){
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if(Store.data.settings.theme === 'system') applyTheme();
      });
    }
    if(!Store.data.profile.onboarded){
      Onb.start();
    } else {
      this.boot();
    }
  },

  boot(){
    document.getElementById('bottomNav').classList.remove('hidden');
    this.switchTab('home');
  },

  switchTab(tab, opts){
    if(this.currentTab && this.modules[this.currentTab] && this.modules[this.currentTab].unmount){
      this.modules[this.currentTab].unmount();
    }
    this.currentTab = tab;
    document.querySelectorAll('.nav-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    const appEl = document.getElementById('app');
    this.modules[tab].mount(appEl, opts);
    window.scrollTo(0,0);
  }
};

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', () => App.switchTab(btn.dataset.tab));
});

document.addEventListener('DOMContentLoaded', () => App.init());

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
